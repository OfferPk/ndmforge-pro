<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#0b0f19" rx="12"/>
  <rect x="20" y="20" width="860" height="60" fill="#131b2e" stroke="#1e2c4a" rx="8"/>
  <text x="40" y="58" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">NDMForge Pro — System Architecture</text>
  <text x="580" y="58" fill="#94a3b8" font-family="sans-serif" font-size="14">CCSDS 506.0-B-1 / ISO 22644</text>

  <!-- Left: Inputs -->
  <rect x="40" y="110" width="240" height="340" fill="#131b2e" stroke="#1e2c4a" rx="8"/>
  <text x="60" y="140" fill="#818cf8" font-family="sans-serif" font-size="16" font-weight="bold">1. Input Formats</text>
  <rect x="60" y="160" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="190" fill="#f1f5f9" font-family="monospace" font-size="12">Legacy ASCII KVN Files</text>
  <rect x="60" y="225" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="255" fill="#f1f5f9" font-family="monospace" font-size="12">OPM / OEM / OMM Streams</text>
  <rect x="60" y="290" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="320" fill="#f1f5f9" font-family="monospace" font-size="12">CDM Conjunction Notices</text>
  <rect x="60" y="355" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="385" fill="#f1f5f9" font-family="monospace" font-size="12">TDM Tracking Data</text>

  <!-- Middle: Engines -->
  <rect x="330" y="110" width="240" height="340" fill="#131b2e" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="350" y="140" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">2. Transpilation Core</text>
  <rect x="350" y="160" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="190" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">KVN Grammar Lexer</text>
  <rect x="350" y="225" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="255" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">XML DOM Serializer</text>
  <rect x="350" y="290" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="320" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">SI Unit Attribute Engine</text>
  <rect x="350" y="355" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="385" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">10-Point Normative Auditor</text>

  <!-- Right: Outputs -->
  <rect x="620" y="110" width="240" height="340" fill="#131b2e" stroke="#1e2c4a" rx="8"/>
  <text x="640" y="140" fill="#818cf8" font-family="sans-serif" font-size="16" font-weight="bold">3. Outputs &amp; Deliverables</text>
  <rect x="640" y="160" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="190" fill="#f1f5f9" font-family="monospace" font-size="12">CCSDS NDM/XML Documents</text>
  <rect x="640" y="225" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="255" fill="#f1f5f9" font-family="monospace" font-size="12">Unified &lt;ndm&gt; Bundles</text>
  <rect x="640" y="290" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="320" fill="#f1f5f9" font-family="monospace" font-size="12">Reconstructed KVN Files</text>
  <rect x="640" y="355" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="385" fill="#34d399" font-family="monospace" font-size="12">Audit Scorecard (10/10)</text>
</svg>
